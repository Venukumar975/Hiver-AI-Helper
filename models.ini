[gemini_models]
# Fallback Gemini models ordered by high tokens + reasoning capability
# If a model returns 503 (Busy), 429 (Quota Exhausted), or fails, the pipeline automatically falls back to the next priority.
priority_1 = gemini-3.8-flash
priority_2 = gemini-3.7-flash
priority_3 = gemini-3.6-flash
priority_4 = gemini-3.5-flash
priority_5 = gemini-3.5-flash-lite
priority_6 = gemini-3.1-flash-lite
priority_7 = gemini-3-flash-preview
priority_8 = gemini-flash-lite-latest
